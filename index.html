<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxim Shevchenko — Digital Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav" id="top">
    <div class="container nav__inner">
      <a class="logo" href="/">maxim st.</a>
      <nav class="menu">
        <a href="/about">about</a>
        <a href="/work">work</a>
        <a href="/contact">contact</a>
      </nav>
      <a class="pill" href="/contact">open to work</a>
    </div>
  </header>

  <main data-page="home">
    <section id="hero" class="hero container"></section>
    <section id="skills" class="skills">
      <div class="container">
        <div class="skills__strip" id="skills-strip"></div>
      </div>
    </section>
    <section id="about" class="section container">
      <div class="section__header">
        <p class="kicker">about</p>
        <h2>Design leader crafting memorable products</h2>
      </div>
      <div class="about__grid" id="about-content"></div>
    </section>
    <section id="work" class="section container">
      <div class="section__header">
        <p class="kicker">recent work</p>
        <h2>Selected projects</h2>
      </div>
      <div class="work__grid" id="work-cards"></div>
    </section>
    <section id="contact" class="section container">
      <div class="cta" id="cta"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© <span id="year"></span> Maxim Shevchenko-Tymchuk</p>
      <div class="social" id="footer-links"></div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
