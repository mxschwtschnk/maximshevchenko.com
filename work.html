        <h2 class="desktop-shell__title">WORK</h2>
      </header>

      <div class="desktop-stage" aria-live="polite">
        <article class="desktop-panel" data-panel="mobility" style="--panel-top: 14%; --panel-left: 12%;" tabindex="0" role="button" aria-label="Open Mobility Platform project">

            <p class="desktop-panel__title">Mobility Platform</p>

            <img src="Thumb_switch.png" alt="Preview of Mobility Platform interface">

        <article class="desktop-panel" data-panel="erp" style="--panel-top: 32%; --panel-left: 46%;" tabindex="0" role="button" aria-label="Open ERP Application project">

          </header>
          <div class="desktop-panel__body">
            <img src="Thumb_erp.png" alt="Preview of ERP application dashboard">
          </div>

        <article class="desktop-panel" data-panel="telemedicine" style="--panel-top: 55%; --panel-left: 22%;" tabindex="0" role="button" aria-label="Open Telemedicine Platform project">
          <header class="desktop-panel__bar" aria-label="Telemedicine Platform window">

          </header>
          <div class="desktop-panel__body">
            <img src="Thumb_medicare.png" alt="Preview of telemedicine platform UI">
          </div>

        <ul class="project-modal__meta"></ul>
      </div>

      <div class="project-modal__summary-row">
        <figure class="project-modal__thumb-card">
          <img class="project-modal__thumb" src="" alt="Project preview" loading="lazy">
        </figure>

        <div class="project-modal__accordion" data-open="false">
          <div class="project-modal__description" aria-label="Project description"></div>
          <a class="project-modal__accordion-toggle" href="#" aria-expanded="false">Read more</a>
